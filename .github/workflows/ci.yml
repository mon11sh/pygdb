name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ---- Backend: test every Python service in parallel (in-memory provider) ----
  backend:
    name: test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - accounts_service
          - transactions_service
          - auth_service
          - users_service
          - aadhar_service
          - company_crv_service
          - notification_service
          - central_payment_gateway_service
          - central_gateway_service   # API Gateway pattern (has tests)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pip-audit
      - name: Run tests (in-memory provider)
        working-directory: ${{ matrix.service }}
        env:
          DATABASE_PROVIDER: inmemory
        run: pytest -q
      - name: Dependency vulnerability audit
        working-directory: ${{ matrix.service }}
        run: pip-audit -r requirements.txt || true   # report-only until deps are patched (H-3)

  # ---- Secret scanning across the whole repo ----
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Frontend: lint + build ----
  frontend:
    name: build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---- Docker images build (no push) ----
  docker-build:
    name: build image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        service:
          - accounts_service
          - transactions_service
          - auth_service
          - users_service
          - registry_service        # Service Discovery pattern
          - central_gateway_service # API Gateway pattern
          - frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # Backend + pattern services build from the REPO ROOT so the shared
        # libs/ package is in context; the frontend keeps its own context.
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            docker build -t gdb/frontend:ci ./frontend
          else
            docker build -f ${{ matrix.service }}/Dockerfile -t gdb/${{ matrix.service }}:ci .
          fi
